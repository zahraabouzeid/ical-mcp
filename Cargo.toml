[package]
name = "ical-mcp"
version = "0.1.0"
description = "MCP server that reads any calendar through its iCal link"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/zahraabouzeid/ical-mcp"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
getrandom = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rmcp = { version = "3.7", features = ["server", "macros", "transport-streamable-http-server"] }
rrule = "0.14"
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
url = "2"

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
